name: Device-free checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.6.16"
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv sync --locked --extra dev --extra video --extra mp4 --extra teleop --extra webrtc
      - run: npm ci --ignore-scripts
      - run: uv run --no-sync python tools/check_project.py
      - run: uv run --no-sync python tools/check_publication.py --staged
      - run: uv run --no-sync python -m build --no-isolation
      - run: uv run --no-sync python tools/check_distribution.py
